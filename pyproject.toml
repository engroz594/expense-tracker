[project]
name = "expense-tracker"
version = "0.1.0"
description = "Async multi-currency expense tracker API (FastAPI, SQLAlchemy 2.0, PostgreSQL, Redis)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiobotocore==3.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.163.2",
    "limits>=5.8.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart==0.0.34",
    "redis[hiredis]>=5.2,<6",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

# Local: uv sync (includes dev group)
# Production image: uv sync --frozen --no-dev
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[server]>=5.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
# botocore (pulled in by aioboto3 -> aiobotocore) is a ~13 MB package that changes
# almost daily; pin it so every install resolves the same, already-tested version.
constraint-dependencies = ["botocore==1.42.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import main and app from the project root
asyncio_mode = "auto"
# One event loop for the whole session: the app's module-level engine and Redis client
# keep pooled connections, and those are bound to the loop that opened them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=app --cov=routes --cov-report=term-missing"
# The 85% gate is passed on the command line (pytest --cov-fail-under=85), not set as
# fail_under in [tool.coverage.report]: pytest-cov would apply it to every run,
# so a focused `pytest -k ...` would fail on coverage.

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs on greenlets, and argon2 hashing runs in threads
# (asyncio.to_thread). Without this, coverage loses track after greenlet switches and
# reports code that the tests clearly executed as missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ASYNC flags blocking calls (time.sleep, sync HTTP, open()) inside async functions —
# the brief requires a fully async app, so the linter enforces it.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends(...) in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
