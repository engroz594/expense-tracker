# Expense Tracker — app containers only. PostgreSQL and Redis run on the Docker host
# (like RDS/ElastiCache on AWS); containers reach them via host.docker.internal.
#
#   docker compose up --build
#
# Credentials come from .env (copy .env.example). Docker Desktop resolves
# host.docker.internal itself; on Linux, extra_hosts maps it to the host gateway.

x-app-common: &app-common
  build: .
  # One image for every role (api, migrate); only the command differs.
  image: expense-tracker:local
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: host.docker.internal
    REDIS_HOST: host.docker.internal
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  # One-off: applies Alembic migrations, fills any missing exchange rates for the last
  # 90 days (idempotent), then exits. Mirrors the release step on AWS (a one-off ECS
  # task before the rolling deploy).
  migrate:
    <<: *app-common
    container_name: expense-tracker-migrate
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.fill_exchange_rates"]
    restart: "no"  # override the anchor: a finished one-off job must not be restarted

  api:
    <<: *app-common
    container_name: expense-tracker-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # The slim image has no curl; use the Python that is already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s